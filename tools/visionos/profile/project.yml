# Throwaway visionOS project whose only job is to make Xcode mint the development provisioning
# profile for the app (explicit App ID + the two kernel entitlements the runtime needs: the guest
# memory is a multi-GB mapping far above the default address-space limit). See mint_profile.sh.
name: GTAVProfile
options:
  bundleIdPrefix: org.gtavrecomp
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  GTAVProfile:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: GTAVProfile
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: GTAVProfile.entitlements
    entitlements:
      path: GTAVProfile.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
